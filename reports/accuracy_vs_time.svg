<line class="interval" x1="384.1" x2="384.1" y1="247.7" y2="362.9"/>
<circle class="dot" cx="384.1" cy="339.7" r="5"/>
<text class="label" x="394.1" y="338.0">qwen2.5-coder:14b (prompt v2)</text>
</g>
<g><title>qwen2.5-coder:7b: 1/20 runs passed (5%, 95 % interval 1%–24%), median 27 s per run</title>
<line class="interval" x1="184.5" x2="184.5" y1="287.7" y2="365.0"/>
<circle class="dot" cx="184.5" cy="351.0" r="5"/>
<text class="label" x="194.5" y="353.0">qwen2.5-coder:7b</text>
</g>
<g><title>qwen2.5-coder:7b (prompt v2): 0/20 runs passed (0%, 95 % interval 0%–16%), median 32 s per run</title>
<line class="interval" x1="200.8" x2="200.8" y1="313.2" y2="368.0"/>
<circle class="dot" cx="200.8" cy="368.0" r="5"/>
<text class="label" x="210.8" y="368.0">qwen2.5-coder:7b (prompt v2)</text>
</g>
</svg>
