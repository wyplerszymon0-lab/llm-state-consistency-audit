name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only reads the code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Leaderboard is up to date
        run: |
          python run_audit.py
          git diff --ignore-matching-lines='^_Generated' --exit-code reports/leaderboard.md
